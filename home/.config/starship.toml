# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$golang\
$nodejs\
$rust\
$line_break\
$character"""

palette = "catppuccin_mocha"
command_timeout = 1000

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[X](bold red)"

[git_branch]
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"

[git_state]
style = "bold red"

[directory]
truncation_length = 4
style = "bold blue"
format = "[ $path]($style)[$read_only]($read_only_style) "
read_only_style = "bold red"

[python]
style = "bold yellow"

[golang]
style = "bold sky"

[nodejs]
style = "bold green"

[rust]
style = "bold peach"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
