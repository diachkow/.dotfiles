colourful: true

filekinds:
  normal: {foreground: "#cdd6f4"}
  directory: {foreground: "#89b4fa", is_bold: true}
  symlink: {foreground: "#94e2d5"}
  pipe: {foreground: "#f9e2af"}
  block_device: {foreground: "#fab387", is_bold: true}
  char_device: {foreground: "#fab387", is_bold: true}
  socket: {foreground: "#cba6f7"}
  special: {foreground: "#cba6f7"}
  executable: {foreground: "#a6e3a1", is_bold: true}
  mount_point: {foreground: "#89dceb", is_bold: true, is_underline: true}

perms:
  user_read: {foreground: "#a6e3a1"}
  user_write: {foreground: "#f9e2af"}
  user_execute_file: {foreground: "#89dceb", is_bold: true}
  user_execute_other: {foreground: "#94e2d5"}
  group_read: {foreground: "#a6e3a1"}
  group_write: {foreground: "#f9e2af"}
  group_execute: {foreground: "#89dceb"}
  other_read: {foreground: "#9399b2"}
  other_write: {foreground: "#fab387"}
  other_execute: {foreground: "#94e2d5"}
  special_user_file: {foreground: "#f38ba8", is_bold: true}
  special_other: {foreground: "#f38ba8", is_bold: true}
  attribute: {foreground: "#6c7086"}

size:
  major: {foreground: "#f9e2af"}
  minor: {foreground: "#89dceb"}
  number_byte: {foreground: "#94e2d5"}
  number_kilo: {foreground: "#a6e3a1"}
  number_mega: {foreground: "#f9e2af"}
  number_giga: {foreground: "#fab387"}
  number_huge: {foreground: "#f38ba8", is_bold: true}
  unit_byte: {foreground: "#6c7086"}
  unit_kilo: {foreground: "#6c7086"}
  unit_mega: {foreground: "#6c7086"}
  unit_giga: {foreground: "#6c7086"}
  unit_huge: {foreground: "#6c7086"}

users:
  user_you: {foreground: "#a6e3a1"}
  user_root: {foreground: "#f38ba8", is_bold: true}
  user_other: {foreground: "#bac2de"}
  group_yours: {foreground: "#94e2d5"}
  group_other: {foreground: "#9399b2"}
  group_root: {foreground: "#fab387"}

links:
  normal: {foreground: "#9399b2"}
  multi_link_file: {foreground: "#a6e3a1"}

git:
  new: {foreground: "#a6e3a1"}
  modified: {foreground: "#f9e2af"}
  deleted: {foreground: "#f38ba8"}
  renamed: {foreground: "#94e2d5"}
  typechange: {foreground: "#fab387"}
  ignored: {foreground: "#6c7086", is_dimmed: true}
  conflicted: {foreground: "#f38ba8", is_bold: true}

git_repo:
  branch_main: {foreground: "#89dceb", is_bold: true}
  branch_other: {foreground: "#94e2d5"}
  git_clean: {foreground: "#a6e3a1"}
  git_dirty: {foreground: "#f9e2af"}

security_context:
  colon: {foreground: "#6c7086"}
  user: {foreground: "#89dceb"}
  role: {foreground: "#cba6f7"}
  typ: {foreground: "#f9e2af"}
  range: {foreground: "#94e2d5"}

file_type:
  image: {foreground: "#cba6f7"}
  video: {foreground: "#f38ba8"}
  music: {foreground: "#94e2d5"}
  lossless: {foreground: "#89dceb"}
  crypto: {foreground: "#cba6f7"}
  document: {foreground: "#f9e2af"}
  compressed: {foreground: "#fab387"}
  temp: {foreground: "#6c7086"}
  compiled: {foreground: "#bac2de"}
  build: {foreground: "#f9e2af", is_bold: true}
  source: {foreground: "#89dceb"}

punctuation: {foreground: "#6c7086"}
date: {foreground: "#9399b2"}
inode: {foreground: "#6c7086"}
blocks: {foreground: "#6c7086"}
header: {foreground: "#89dceb", is_bold: true}
octal: {foreground: "#9399b2"}
flags: {foreground: "#bac2de"}

symlink_path: {foreground: "#bac2de"}
control_char: {foreground: "#6c7086"}
broken_symlink: {foreground: "#f38ba8", is_bold: true}
broken_path_overlay: {foreground: "#f38ba8"}

filenames:
  "README":
    filename: {foreground: "#f9e2af", is_bold: true}
  "README.md":
    filename: {foreground: "#f9e2af", is_bold: true}
  "LICENSE":
    filename: {foreground: "#9399b2"}

extensions:
  "md":
    filename: {foreground: "#f9e2af"}
  "mdx":
    filename: {foreground: "#f9e2af"}
  "txt":
    filename: {foreground: "#9399b2"}
