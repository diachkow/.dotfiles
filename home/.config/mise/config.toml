# Global mise tools manifest.
# Install/upgrade everything with: mise install / mise upgrade
# Project-level .mise.toml files layer on top of this config.

[settings.pipx]
uvx = true # pipx backend uses uv tool under the hood

[tools]
# Base toolchain
uv = "0.13.7"
bun = "1.4.4"
"npm:@opencode/cli" = { version = "2.2.5", allow_builds = ["@opencode/cli"] } # exposes `opencode` + `opencode2`; V1 was aqua:anomalyco/opencode
pi = "1.5.0"        # aqua:earendil-works/pi coding agent
"github:backnotprop/plannotator" = "0.28.48"
"github:plannotator/plannotator-tui" = "0.9.9"
"aqua:ankitpokhrel/jira-cli" = "1.7.0"

# Node package manager + npm global CLI tools
pnpm = "12.16.1"
"npm:langfuse-cli" = "1.3.1"

# pypi CLI tools (installed via uv tool)
"pipx:cookiecutter" = "2.7.1"
"pipx:posting" = "2.11.1"
"pipx:ty" = "0.0.96"
"pipx:yamllint" = "1.38.0"
golangci-lint = "2.15.0"
