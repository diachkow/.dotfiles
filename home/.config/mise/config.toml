# Global mise tools manifest.
# Install/upgrade everything with: mise install / mise upgrade
# Project-level .mise.toml files layer on top of this config.

[settings.pipx]
uvx = true # pipx backend uses uv tool under the hood

[tools]
# Base toolchain
uv = "0.12.22"
bun = "1.4.2"
"npm:@opencode/cli" = { version = "2.0.22", allow_builds = ["@opencode/cli"] } # exposes `opencode` + `opencode2`; V1 was aqua:anomalyco/opencode
pi = "1.0.0"        # aqua:earendil-works/pi coding agent
"github:backnotprop/plannotator" = "0.27.25"
"github:plannotator/plannotator-tui" = "0.9.4"
"aqua:ankitpokhrel/jira-cli" = "1.7.0"

# Node package manager + npm global CLI tools
pnpm = "12.8.1"
"npm:langfuse-cli" = "1.2.4"

# pypi CLI tools (installed via uv tool)
"pipx:cookiecutter" = "2.7.1"
"pipx:dunk" = "0.5.0b0"
"pipx:posting" = "2.11.0"
"pipx:ty" = "0.0.84"
"pipx:yamllint" = "1.38.0"
golangci-lint = "latest"
